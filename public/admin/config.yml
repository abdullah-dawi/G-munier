# Decap CMS — لوحة إضافة المحتوى لغير التقنيين
# TODO: اضبط الـ OAuth قبل الاستخدام (انظر README)
backend:
  name: github
  repo: abdullah-dawi/G-munier
  branch: main

# كل إضافة تفتح PR بدل commit مباشر على main
publish_mode: editorial_workflow
locale: ar

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: series
    label: السلاسل والدورات
    label_singular: سلسلة
    folder: src/content/series
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: العنوان, widget: string }
      - { name: kind, label: النوع, widget: select, options: [خطب, دورة] }
      - { name: description, label: الوصف, widget: text }
      - &category { name: category, label: التصنيف, widget: select, options: [تربية, أسرة ومجتمع, عقيدة, فقه, تفسير, حديث, سيرة, رقائق] }
      - { name: book, label: الكتاب المشروح (للدورات), widget: string, required: false }
      - { name: status, label: الحالة, widget: select, options: [مستمرة, مكتملة], default: مستمرة }

  - name: lessons
    label: الخطب والدروس
    label_singular: خطبة / درس
    folder: src/content/lessons
    create: true
    slug: "{{fields.series}}-{{fields.order}}"
    fields:
      - { name: title, label: العنوان, widget: string }
      - { name: series, label: السلسلة, widget: relation, collection: series, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
      - { name: order, label: الرقم في السلسلة, widget: number, value_type: int, min: 1 }
      - &date { name: date, label: التاريخ, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: youtube_id, label: "معرّف يوتيوب (الجزء بعد v=)", widget: string, required: false }
      - { name: audio_url, label: رابط الصوت (Archive.org), widget: string, required: false }
      - { name: summary, label: ملخص في سطرين, widget: text, required: false }
      - { name: body, label: "التفريغ (استخدم ## للعناوين: الخطبة الأولى / الخطبة الثانية)", widget: markdown, required: false }

  - name: articles
    label: المقالات
    label_singular: مقال
    folder: src/content/articles
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: العنوان, widget: string }
      - { name: summary, label: ملخص في سطر, widget: string }
      - *category
      - *date
      - { name: body, label: النص, widget: markdown }

  - name: fawaid
    label: الفوائد
    label_singular: فائدة
    folder: src/content/fawaid
    create: true
    slug: "faida-{{year}}{{month}}{{day}}-{{hour}}{{minute}}"
    fields:
      - { name: body, label: نص الفائدة, widget: text }
      - *category
      - { name: source, label: "من خطبة / درس (اتركه فارغًا لو من كتابة الشيخ)", widget: relation, collection: lessons, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false }
      - *date
